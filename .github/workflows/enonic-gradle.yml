name: Gradle Build

on:
  push:
  # release-tools/release pushes the next SNAPSHOT with GITHUB_TOKEN, which never fires
  # `on: push`, so it re-runs this workflow through `gh workflow run` instead
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN; the release job widens only what it needs
permissions:
  contents: read

permissions:
  id-token: write  # Required for npm OIDC / trusted publishing
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.build-and-publish.outputs.release }}
    steps:
      - id: build-and-publish
        uses: enonic/release-tools/build-and-publish@master
        with:
          repoUser: ci
          repoPassword: ${{ secrets.ARTIFACTORY_PASSWORD }}
          npmPublish: true
          releaseBranch: |
            master
            1.x

  release:
    runs-on: ubuntu-latest

    needs: build
    if: needs.build.outputs.release == 'true'

    permissions:
      contents: write # tag, GitHub release, next-SNAPSHOT commit
      actions: write # `gh workflow run` for the SNAPSHOT build

    steps:
      - uses: enonic/release-tools/release@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
